name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 13
      - name: Engine is generated from the frozen original
        run: python tools/make_engine.py --check
      - name: Build and install the package
        run: python -m pip install ".[test]"
      - name: Run tests (includes parity with the original program)
        run: python -m pytest -v

  mf6-crate:
    name: Rust mf6 crate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install mf6 (same version as the test fixtures)
        uses: modflowpy/install-modflow-action@v1
        with:
          owner: MODFLOW-ORG
          repo: modflow6
          tag: 6.8.1
          github_token: ${{ github.token }}
      - run: cargo fmt -p mf6 --check
      - run: cargo clippy -p mf6 --all-targets -- -D warnings
      - name: Tests (parity with FloPy; runs mf6)
        run: cargo test -p mf6
        env:
          MF6_REQUIRED: "1"
